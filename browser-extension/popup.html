<!DOCTYPE html>
<html lang="fa" dir="rtl" id="extRoot">
<head>
  <meta charset="utf-8" />
  <title>Robotic Agent Companion</title>
  <style>
    body {
      width: 360px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0F172A;
      color: #F8FAFC;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-weight: 700; color: #60A5FA; font-size: 14px; }
    .lang-btn { background: #1E293B; color: #E2E8F0; border: 1px solid #3B82F6; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 11px; }
    textarea {
      width: 100%;
      height: 95px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1E293B;
      color: #F8FAFC;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    button.act {
      flex: 1;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.act.secondary { background: #059669; }
    .status { font-size: 11px; color: #34D399; min-height: 16px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="title">🛡️ Robotic Agent Web Shield</span>
    <button class="lang-btn" id="toggleLangBtn">FA / EN</button>
  </div>
  <textarea id="inputText" placeholder="متن، پرامپت یا جدول کپی‌شده را اینجا قرار دهید..."></textarea>
  <div class="actions">
    <button class="act" id="scrubPiiBtn">🛡️ سانسور اطلاعات حساس (PII)</button>
    <button class="act secondary" id="coachPromptBtn">✨ تبدیل به پرامپت حرفه‌ای</button>
  </div>
  <div class="status" id="statusMsg">۱۰۰٪ پردازش محلی درون مرورگر — بدون ارسال به سرور</div>
  <script src="popup.js"></script>
</body>
</html>
